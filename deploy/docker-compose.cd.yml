# CD override: build & run the fork checkout instead of Hub ghcr.io/mikecdd19891107-spec/agentbyte:latest.
# Usage (from /srv/agentbyte/deploy):
#   docker compose -f docker-compose.local.yml -f docker-compose.cd.yml up -d --build
services:
  agentbyte:
    image: agentbyte:cd
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: cd
        COMMIT: local
    pull_policy: never
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - all_proxy=${ALL_PROXY:-}
      - no_proxy=${NO_PROXY:-}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}

    # BusyBox wget ignores NO_PROXY when HTTP_PROXY is set; -Y off keeps health local.
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
