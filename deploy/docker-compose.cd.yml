# CD override: build & run the fork checkout instead of Hub weishaw/sub2api:latest.
# Usage (from /srv/sub2api/deploy):
#   docker compose -f docker-compose.local.yml -f docker-compose.cd.yml up -d --build
services:
  sub2api:
    image: sub2api:cd
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: cd
        COMMIT: local
    pull_policy: never
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - all_proxy=${ALL_PROXY:-}
      - no_proxy=${NO_PROXY:-}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
