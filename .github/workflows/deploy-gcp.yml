name: Deploy GCP (jp-app-01)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp-jp-app-01
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to jp-app-01
    runs-on: [self-hosted, jp-app-01, linux, x64]
    timeout-minutes: 90
    steps:
      - name: Sync and deploy from /srv/sub2api
        shell: bash
        run: |
          set -euo pipefail
          export REPO_DIR=/srv/sub2api
          export BRANCH=main
          export REMOTE=origin
          cd "$REPO_DIR"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo 'Tracked server files have local changes; refusing to overwrite them.' >&2; exit 1; }
          git fetch "$REMOTE" "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'main changed since this workflow was queued; a newer run must deploy it.' >&2; exit 1; }
          git merge --ff-only "$GITHUB_SHA"
          SKIP_GIT=1 SKIP_BUILD=0 EXPECTED_COMMIT="$GITHUB_SHA" "$REPO_DIR/deploy/cd-deploy.sh"
